# Home Assistant Helper Configuration Example
#
# This file shows the complete set of Home Assistant helpers that need to be
# created for Rehoboam's LED panel configuration.
#
# Copy the relevant sections into your Home Assistant configuration:
# - Add to configuration.yaml, or
# - Create a separate helpers.yaml file and include it:
#   homeassistant:
#     packages: !include_dir_named packages
#   (then place this content in packages/helpers.yaml)
#
# After adding these helpers, restart Home Assistant, then use the UI
# (Settings → Devices & Services → Helpers) to configure each LED's values.
#
# The config_sync_service will read these helpers and generate data/led_config.json
# automatically. See docs/home_assistant.md for full documentation.

