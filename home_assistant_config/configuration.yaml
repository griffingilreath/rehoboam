homeassistant:
  packages: !include_dir_named packages

# Default Config
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Global customizations that don't fit into packages
homeassistant:
  customize_glob:
    "sensor.eve_energy_*_energy*":
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh

# Global Inputs (unless moved to specific packages)
input_number:
  electricity_price_usd_kwh:
    name: Electricity price
    min: 0
    max: 2
    step: 0.0001
    unit_of_measurement: "USD/kWh"
    mode: box
    initial: 0.1838

input_text:
  input_text_pihole_filter:
    name: input_text.pihole_filter
    icon: mdi:pi-hole
    max: 60
