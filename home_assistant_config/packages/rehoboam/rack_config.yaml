# Home Assistant Helper Configuration for Rehoboam
#
# This file is synced with the Rehoboam 'led_config.json' data.
# Note that we have mapped:
#   LED 14 -> Snow Plow Status (S7)
#   LED 15 -> Water Usage (S8)
#
# This demonstrates how custom municipal and utility sensors can
# drive the LED visualization.

