###############################################################################
# PACKAGE: EXTERIOR ZONES
#
# Locations:
#   - Backyard
#   - Side Yard
#   - Front Yard
#   - Front Porch
#   - Garage
#
# Description:
#   Group all sensors, lights, and automations for the outside of the house here.
###############################################################################

# -----------------------------------------------------------------------------
# GROUPS / LIGHT GROUPS
# Combine multiple entities into one logical "Room" entity
# -----------------------------------------------------------------------------
light:
  - platform: group
    name: "Exterior Lights"
    entities:
      # - light.front_porch_main
      # - light.garage_sconces
      # - light.backyard_flood

# -----------------------------------------------------------------------------
# TEMPLATE SENSORS
# Aggregated status for the zone
# -----------------------------------------------------------------------------
template:
  - binary_sensor:
      - name: "Exterior Occupancy"
        unique_id: zone_occupancy_exterior
        device_class: occupancy
        state: >
          {{ is_state('binary_sensor.backyard_camera_motion', 'on')
             or is_state('binary_sensor.front_doorbell_motion', 'on') }}

# -----------------------------------------------------------------------------
# AUTOMATIONS
# -----------------------------------------------------------------------------
automation:
  - alias: "[Exterior] Porch Lights at Sunset"
    id: exterior_porch_sunset
    trigger:
      - platform: sun
        event: sunset
        offset: "-00:15:00"
    action:
      - service: light.turn_on
        target:
          entity_id: light.front_porch_main
