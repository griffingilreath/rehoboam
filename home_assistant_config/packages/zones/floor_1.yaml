###############################################################################
# PACKAGE: FIRST FLOOR (MAIN)
#
# Rooms:
#   - Living Room
#   - Dining Room
#   - Kitchen
#   - Sunroom
#   - Hallway
#   - 1st Floor Bath
#   - Laundry Room (Assumed 1st floor, move if incorrect)
###############################################################################

# -----------------------------------------------------------------------------
# LIGHT GROUPS
# -----------------------------------------------------------------------------
light:
  - platform: group
    name: "Living Room Lights"
    entities:
      # - light.living_room_overhead
      # - light.living_room_lamp

  - platform: group
    name: "Kitchen Lights"
    entities:
      # - light.kitchen_main
      # - light.kitchen_island

# -----------------------------------------------------------------------------
# AUTOMATIONS
# -----------------------------------------------------------------------------
automation:
  - alias: "[Living Room] Movie Mode"
    id: living_room_movie_mode
    trigger:
      - platform: state
        entity_id: media_player.living_room_tv
        to: "playing"
    action:
      - service: light.turn_off
        target:
          entity_id: light.living_room_overhead
      - service: light.turn_on
        target:
          entity_id: light.living_room_lamp
        data:
          brightness_pct: 20
