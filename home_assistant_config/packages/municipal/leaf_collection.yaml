###############################################################################
# PACKAGE: LEAF COLLECTION
#
# What it does:
#   - Queries Milwaukee's ArcGIS REST API to find your leaf collection route
#   - Shows your route number, current status (collected/pending/in-progress),
#     and whether this is the final collection round for the season
#   - Tracks the window when you can rake leaves to the curb
#   - Remembers the last date your route was confirmed collected
#   - Sends a reminder at season start and when your route is collected
#
# ⚠️  ANNUAL MAINTENANCE REQUIRED:
#   Milwaukee publishes a NEW ArcGIS dataset every fall with a new URL.
#   Before each leaf season (mid-September), check:
#     https://data.milwaukee.gov
#   Search for "Leaf Collection" and update `leaf_arcgis_layer_url` in HA.
#   The current default URL was published in 2022 and may no longer be active.
#
# Fields from the ArcGIS API:
#   SANLEAF   — Your leaf route number (e.g., "14A")
#   Status    — "Collected", "Not Collected", "In Progress", or blank
#   FinalRound — "Yes" / "No": whether this is the last pass of the season
###############################################################################

# ─── CONFIGURABLE SETTINGS ────────────────────────────────────────────────────
# Update leaf_arcgis_layer_url each fall via the HA UI (Settings → Helpers)
# without needing to edit any YAML files.

input_text:
  leaf_arcgis_layer_url:
    name: "Leaf Collection: ArcGIS Layer URL"
    initial: >-
      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/Leaf_Routes_061022_view/FeatureServer/0/query
    max: 500
    icon: mdi:map-marker-path

  leaf_season_start:
    name: "Leaf Collection: Season Start (MM-DD)"
    initial: "10-01"
    max: 5
    icon: mdi:calendar-start

  leaf_season_end:
    name: "Leaf Collection: Season End (MM-DD)"
    initial: "11-20"
    max: 5
    icon: mdi:calendar-end

# ─── PERSISTENT HISTORY ───────────────────────────────────────────────────────

input_datetime:
  leaf_last_confirmed_collection:
    name: "Leaf: Last Confirmed Collection"
    has_date: true
    has_time: false
    icon: mdi:leaf

input_text:
  leaf_route_id:
    name: "Leaf: My Route ID"
    initial: "unknown"
    max: 20
    icon: mdi:routes

# ─── REST SENSOR ─────────────────────────────────────────────────────────────

rest:
  # Queries your address location against the leaf route layer.
  # Returns the route attributes for your area.
  - resource_template: >-
      {{ states('input_text.leaf_arcgis_layer_url') }}?f=json
      &geometry={{ secret('home_longitude') }},{{ secret('home_latitude') }}
      &geometryType=esriGeometryPoint&inSR=4326
      &spatialRel=esriSpatialRelIntersects
      &outFields=SANLEAF,Status,FinalRound
      &returnGeometry=false
    method: GET
    scan_interval: 21600      # Every 6 hours — data changes at most once per day
    timeout: 30
    sensor:
      - name: mke_leaf_route_raw
        unique_id: mke_leaf_route_raw
        value_template: >-
          {% if value_json is mapping and 'features' in value_json %}
            {{ value_json.features | count }}
          {% else %}
            0
          {% endif %}
        json_attributes:
          - features

# ─── TEMPLATE SENSORS & BINARY SENSORS ───────────────────────────────────────

template:
  - sensor:

      # Your leaf route number (e.g., "14A")
      - name: "Leaf: My Route"
        unique_id: leaf_my_route
        icon: mdi:routes
        state: >-
          {% set features = state_attr('sensor.mke_leaf_route_raw', 'features') | default([], true) %}
          {% if features %}
            {{ features[0].attributes.SANLEAF | default('unknown') }}
          {% else %}
            unknown
          {% endif %}

      # Whether your route has been collected, is in progress, or pending
      - name: "Leaf: Route Status"
        unique_id: leaf_route_status
        icon: mdi:leaf
        state: >-
          {% set features = state_attr('sensor.mke_leaf_route_raw', 'features') | default([], true) %}
          {% if not features %}
            No data (check URL or off-season)
          {% else %}
            {% set status = features[0].attributes.Status | default('') | trim %}
            {% if status == '' or status == 'None' %}
              Status not yet updated
            {% else %}
              {{ status }}
            {% endif %}
          {% endif %}
        attributes:
          route: "{{ states('sensor.leaf_my_route') }}"
          final_round: >-
            {% set features = state_attr('sensor.mke_leaf_route_raw', 'features') | default([], true) %}
            {% if features %}
              {{ features[0].attributes.FinalRound | default('unknown') }}
            {% else %}
              unknown
            {% endif %}
          last_confirmed: "{{ states('input_datetime.leaf_last_confirmed_collection') }}"

      # Combined status for dashboards: season window + route status
      - name: "Leaf: Summary"
        unique_id: leaf_collection_summary
        icon: mdi:leaf-maple
        state: >-
          {% set today = now().date() %}
          {% set year = today.year %}

          {% set start_md = states('input_text.leaf_season_start') | default('10-01') %}
          {% set end_md   = states('input_text.leaf_season_end')   | default('11-20') %}
          {% set start = strptime(year ~ '-' ~ start_md, '%Y-%m-%d').date() %}
          {% set end   = strptime(year ~ '-' ~ end_md,   '%Y-%m-%d').date() %}

          {% set route_status = states('sensor.leaf_route_status') %}

          {% if today < start %}
            Off-season — raking window opens {{ start.strftime('%-m/%-d') }}
          {% elif today > end %}
            Season over — collection complete for {{ year }}
          {% else %}
            Route {{ states('sensor.leaf_my_route') }}: {{ route_status }}
          {% endif %}

  - binary_sensor:
      # True when leaves can be raked to the curb (in the collection window)
      - name: "Leaf: Rake-out Window Open"
        unique_id: leaf_rakeout_window_open
        icon: mdi:leaf
        state: >-
          {% set today = now().date() %}
          {% set year = today.year %}
          {% set start_md = states('input_text.leaf_season_start') | default('10-01') %}
          {% set end_md   = states('input_text.leaf_season_end')   | default('11-20') %}
          {% set start = strptime(year ~ '-' ~ start_md, '%Y-%m-%d').date() %}
          {% set end   = strptime(year ~ '-' ~ end_md,   '%Y-%m-%d').date() %}
          {{ start <= today <= end }}

      # True on the day your route is marked "Collected"
      - name: "Leaf: Route Collected Today"
        unique_id: leaf_route_collected_today
        icon: mdi:check-circle
        state: >-
          {{ states('sensor.leaf_route_status') | lower == 'collected'
             and is_state('binary_sensor.leaf_rakeout_window_open', 'on') }}

# ─── AUTOMATIONS ─────────────────────────────────────────────────────────────

automation:
  # Record your route ID whenever it changes (update to non-"unknown")
  - id: leaf_record_route_id
    alias: "[Leaf] Record my route ID"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.leaf_my_route
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state not in ['unknown', 'unavailable', ''] }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.leaf_route_id
        data:
          value: "{{ trigger.to_state.state }}"

  # Record confirmed collection date when route status becomes "Collected"
  - id: leaf_record_confirmed_collection
    alias: "[Leaf] Record confirmed collection date"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.leaf_route_collected_today
        to: "on"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.leaf_last_confirmed_collection
        data:
          date: "{{ now().date().isoformat() }}"

  # Notify when your route has been collected
  - id: leaf_notify_route_collected
    alias: "[Leaf] Notify — route collected"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.leaf_route_collected_today
        from: "off"
        to: "on"
    action:
      - service: notify.notify
        data:
          title: "🍂 Leaf Route Collected"
          message: >-
            Route {{ states('sensor.leaf_my_route') }} has been collected.
            {% set final = state_attr('sensor.leaf_route_status', 'final_round') %}
            {% if final == 'Yes' %}This was the FINAL round for the season.{% endif %}

  # Season-start reminder on Oct 1 (or whatever leaf_season_start is set to)
  - id: leaf_season_start_reminder
    alias: "[Leaf] Season start — rake out reminder"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.leaf_rakeout_window_open
        from: "off"
        to: "on"
    action:
      - service: notify.notify
        data:
          title: "🍂 Leaf Season Started"
          message: >-
            Leaf collection season is now open.
            You can rake leaves to the curb.
            Your route is {{ states('sensor.leaf_my_route') }}.
            Season ends {{ states('input_text.leaf_season_end') }}.

  # Annual URL check reminder on September 15th
  - id: leaf_annual_url_check_reminder
    alias: "[Leaf] Annual — check ArcGIS URL"
    mode: single
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: template
        value_template: >-
          {{ now().month == 9 and now().day == 15 }}
    action:
      - service: notify.notify
        data:
          title: "🍂 Leaf Season: Update ArcGIS URL"
          message: >-
            It's mid-September — time to check if Milwaukee has published a new
            leaf collection dataset. Go to https://data.milwaukee.gov, search
            "Leaf Collection", and update the URL in HA under
            Settings → Helpers → "Leaf Collection: ArcGIS Layer URL".
