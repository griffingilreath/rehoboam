###############################################################################
# PACKAGE: RECYCLING
#
# Completely self-contained — no dependency on any other package.
#
# What it does:
#   - Queries Milwaukee's sanitation API for the next recycling pickup date
#   - Provides days-until counter and a "today" flag for automations/dashboards
#   - Remembers the last confirmed pickup date across HA restarts
#   - Sends an evening reminder the night before pickup
#
# Setup:
#   Set milwaukee_garbage_url in secrets.yaml (same endpoint as trash):
#     milwaukee_garbage_url: "https://itmdapps.milwaukee.gov/DpwServletsPublic/garbage_day?address=2930N39thStreet"
#
#   Expected JSON:
#     { "success": true,
#       "garbage": { ... },
#       "recycling": { "date": "Monday January 29, 2024", "route": "B7" } }
#
# Maintenance:
#   See packages/municipal/README.md for troubleshooting the endpoint.
###############################################################################

rest:
  # Independent REST sensor — recycling.yaml does not share state with trash.yaml
  - resource: !secret milwaukee_garbage_url
    method: GET
    scan_interval: 14400     # Refresh every 4 hours
    timeout: 45
    headers:
      User-Agent: "Mozilla/5.0 (Home Assistant; Municipal Monitor)"
    sensor:
      - name: mke_recycling_api
        unique_id: mke_recycling_api
        value_template: >-
          {% if value_json is mapping and value_json.get('success') %}
            ok
          {% else %}
            error
          {% endif %}
        json_attributes:
          - recycling

# ─── PERSISTENT HISTORY ───────────────────────────────────────────────────────

input_datetime:
  recycling_last_confirmed_pickup:
    name: "Recycling: Last Confirmed Pickup"
    has_date: true
    has_time: false
    icon: mdi:recycle

# ─── TEMPLATE SENSORS & BINARY SENSORS ───────────────────────────────────────

template:
  - sensor:

      - name: "Recycling: Next Pickup"
        unique_id: recycling_next_pickup
        device_class: timestamp
        icon: mdi:recycle
        state: >-
          {% set r = state_attr('sensor.mke_recycling_api', 'recycling') %}
          {% if r and r.get('date') %}
            {% set dt = strptime(r['date'] | trim, "%A %B %d, %Y") %}
            {{ dt.replace(tzinfo=now().tzinfo).isoformat() }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          route: >-
            {% set r = state_attr('sensor.mke_recycling_api', 'recycling') %}
            {{ r.get('route', 'unknown') if r else 'unknown' }}
          api_status: "{{ states('sensor.mke_recycling_api') }}"

      - name: "Recycling: Days Until Pickup"
        unique_id: recycling_days_until_pickup
        unit_of_measurement: "days"
        icon: mdi:calendar-clock
        state: >-
          {% set r = state_attr('sensor.mke_recycling_api', 'recycling') %}
          {% if r and r.get('date') %}
            {% set dt = strptime(r['date'] | trim, "%A %B %d, %Y") %}
            {{ (dt.date() - now().date()).days }}
          {% else %}
            unknown
          {% endif %}

      - name: "Recycling: Last Confirmed Pickup"
        unique_id: recycling_last_confirmed_sensor
        device_class: timestamp
        icon: mdi:clock-check
        state: >-
          {% set d = states('input_datetime.recycling_last_confirmed_pickup') %}
          {% if d not in ['unknown', 'unavailable', ''] %}
            {{ as_datetime(d).replace(tzinfo=now().tzinfo).isoformat() }}
          {% else %}
            unknown
          {% endif %}

  - binary_sensor:
      - name: "Recycling: Pickup Today"
        unique_id: recycling_pickup_today
        icon: mdi:recycle
        state: >-
          {{ states('sensor.recycling_days_until_pickup') | int(99) == 0 }}

# ─── AUTOMATIONS ─────────────────────────────────────────────────────────────

automation:
  # Record pickup date on the day of collection
  - id: recycling_record_confirmed_pickup
    alias: "[Recycling] Record confirmed pickup date"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.recycling_pickup_today
        to: "on"
        for:
          minutes: 30
    condition:
      - condition: template
        value_template: >-
          {{ states('input_datetime.recycling_last_confirmed_pickup') | default('') !=
             now().date().isoformat() }}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.recycling_last_confirmed_pickup
        data:
          date: "{{ now().date().isoformat() }}"

  # Evening reminder the day BEFORE pickup
  - id: recycling_evening_reminder
    alias: "[Recycling] Evening reminder — put bins out"
    mode: single
    trigger:
      - platform: time
        at: "20:00:00"
    condition:
      - condition: template
        value_template: "{{ states('sensor.recycling_days_until_pickup') | int(99) == 1 }}"
    action:
      - service: notify.notify
        data:
          title: "♻️ Recycling Tomorrow"
          message: >-
            Recycling pickup is tomorrow
            (route {{ state_attr('sensor.recycling_next_pickup', 'route') | default('unknown') }}).
            Put the bin out tonight.
