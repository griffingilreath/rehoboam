###############################################################################
# PACKAGE: MILWAUKEE MUNICIPAL SERVICES (SNOW & LEAVES)
#
# Description:
#   Tracks municipal services (Snow Plows, Leaves, Garbage) with robust
#   fallback strategies to ensure long-term reliability.
#
# LTS STRATEGY (Long Term Support):
#   1. Snow Routes (ArcGIS): This is the official system of record.
#      - Status: STABLE (HTTP/2, TLS 1.3).
#      - Fallback: If 100m radius fails, check 500m radius to confirm system is up.
#   2. Garbage/Recycling (Legacy Servlet):
#      - Status: FRAGILE (Old HTML servlet, returns HTML instead of JSON).
#      - Strategy: We use a lightweight "ping" sensor to check if the service is up.
#      - Future-Proofing: The official "Garbage Day" app API is the preferred
#        replacement once fully documented.
#
###############################################################################

# -----------------------------------------------------------------------------
# REST SENSORS (With Reliability Configurations)
# -----------------------------------------------------------------------------
rest:
  # 1. SNOW PLOWS (Primary)
  #    Checks for activity within 100m. If this returns 0, it might just mean
  #    no plows are nearby, OR the API is down.
  - resource_template: >-
      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/SnowRoutes_PublicView/FeatureServer/0/query?f=json&geometry={{ states('input_number.milwaukee_longitude') }},{{ states('input_number.milwaukee_latitude') }}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&distance=100&units=esriSRUnit_Meter&outFields=roadname,lastserviced&returnGeometry=false
    method: GET
    scan_interval: 900
    timeout: 30
    sensor:
      - name: mke_snow_raw
        unique_id: mke_snow_raw
        value_template: >-
          {% if value_json is mapping and 'features' in value_json %}
            {{ value_json.features | count }}
          {% else %}
            0
          {% endif %}
        json_attributes:
          - features

  # 2. SNOW PLOWS (System Health Check)
  #    Checks a massive 5km radius. If THIS returns 0 features during winter,
  #    the City's API is likely broken/down.
  - resource_template: >-
      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/SnowRoutes_PublicView/FeatureServer/0/query?f=json&geometry={{ states('input_number.milwaukee_longitude') }},{{ states('input_number.milwaukee_latitude') }}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&distance=5000&units=esriSRUnit_Meter&returnCountOnly=true
    method: GET
    scan_interval: 3600 # Check hourly
    timeout: 30
    sensor:
      - name: mke_snow_system_health
        unique_id: mke_snow_system_health
        value_template: >-
          {% if value_json is mapping and 'count' in value_json %}
            {{ value_json.count > 0 }}
          {% else %}
            False
          {% endif %}

  # 3. GARBAGE DAY (Legacy Scraper)
  #    We fetch the HTML page. If it contains "Sanitation Collection Schedule",
  #    we know the service is live.
  - resource: "https://itmdapps.milwaukee.gov/DpwServletsPublic/garbage_day?address=2930N39thStreet"
    method: GET
    scan_interval: 21600
    timeout: 45
    headers:
      User-Agent: "Mozilla/5.0 (Home Assistant; Municipal Monitor)"
    sensor:
      - name: Milwaukee Garbage Service Status
        unique_id: mke_garbage_service_status
        value_template: >-
          {{ 'Sanitation Collection Schedule' in value }}

  # 4. LEAF COLLECTION
  - resource_template: >-
      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/Leaf_Routes_061022_view/FeatureServer/0/query?f=json&geometry={{ states('input_number.milwaukee_longitude') }},{{ states('input_number.milwaukee_latitude') }}&geometryType=esriGeometryPoint&inSR=4326&outFields=SANLEAF,Status,FinalRound&returnGeometry=false
    method: GET
    scan_interval: 21600
    timeout: 30
    sensor:
      - name: mke_leaf_status_raw
        unique_id: mke_leaf_status_raw
        value_template: >-
          {% if value_json is mapping and 'features' in value_json %}
            {{ value_json.features | count }}
          {% else %}
            0
          {% endif %}
        json_attributes:
          - features

# -----------------------------------------------------------------------------
# TEMPLATE SENSORS
# -----------------------------------------------------------------------------
template:
  - sensor:
      # -- SNOW PLOW STATUS --
      - name: Snow Plow Status
        unique_id: snow_plow_status
        state: >-
          {% set system_ok = is_state('sensor.mke_snow_system_health', 'True') %}
          {% set last = states('sensor.snow_last_plowed') %}
          
          {% if not system_ok and now().month in [12, 1, 2] %}
            System Outage
          {% elif last in ['unknown', 'unavailable', 'none', ''] %}
            No recent activity
          {% else %}
            {% set dt = as_datetime(last) %}
            {% set delta_min = (now() - dt).total_seconds() / 60 %}
            {% if delta_min <= 10 %}
              Within last 10 minutes
            {% elif delta_min <= 30 %}
              Between 10 and 30 minutes
            {% else %}
              Over 30 minutes
            {% endif %}
          {% endif %}
        attributes:
          roadname: "{{ states('sensor.snow_plow_road_name') }}"
          system_health: "{{ states('sensor.mke_snow_system_health') }}"

      # Helper sensors (Road Name, Last Plowed) remain same as before...
      - name: Snow Plow Road Name
        unique_id: snow_plow_road_name
        state: >-
          {% set features = state_attr('sensor.mke_snow_raw', 'features') | default([], true) %}
          {% if not features %}
            unknown
          {% else %}
            {% set roads = features | map(attribute='attributes.roadname') | list %}
            {% if 'N 39TH ST' in roads %}
              N 39TH ST
            {% elif 'W LOCUST ST' in roads %}
              W LOCUST ST
            {% else %}
              {{ roads[0] }}
            {% endif %}
          {% endif %}

      - name: Snow Last Plowed
        unique_id: snow_last_plowed
        device_class: timestamp
        state: >-
          {% set features = state_attr('sensor.mke_snow_raw', 'features') | default([], true) %}
          {% set road = states('sensor.snow_plow_road_name') %}
          {% if not features or road in ['unknown', 'unavailable', ''] %}
            unknown
          {% else %}
            {% set match = features | selectattr('attributes.roadname', 'equalto', road) | list %}
            {% if match %}
              {% set ms = match[0].attributes.lastserviced %}
              {% if ms in [none, '', 0] %}
                unknown
              {% else %}
                {{ as_local(as_datetime(ms / 1000)).isoformat() }}
              {% endif %}
            {% else %}
              unknown
            {% endif %}
          {% endif %}
      
      # -- LEAF SEASON LOGIC --
      - name: Leaf Collection Season
        unique_id: leaf_collection_season
        state: >-
          {% set today = now().date() %}
          {% set y = today.year %}
          {% set start = strptime(y ~ '-10-01', '%Y-%m-%d').date() %}
          {% set end = strptime(y ~ '-11-15', '%Y-%m-%d').date() %}
          {% if today < start %}
            Too Early
          {% elif today <= end %}
            Rake‑out Window
          {% else %}
            Season Over
          {% endif %}

  - binary_sensor:
      - name: Plows Active Nearby
        unique_id: snow_plows_nearby
        state: >-
          {% set status = states('sensor.snow_plow_status') %}
          {{ status in ['Within last 10 minutes', 'Between 10 and 30 minutes'] }}

      - name: Leaf Rake Allowed
        unique_id: leaf_rake_allowed_binary
        state: >-
          {{ 'Rake‑out Window' in states('sensor.leaf_collection_season') }}

# -----------------------------------------------------------------------------
# INPUTS & AUTOMATIONS
# -----------------------------------------------------------------------------
input_datetime:
  last_snow_plow:
    name: Last Snow Plow Date
    has_date: true
    has_time: false

input_number:
  milwaukee_latitude:
    name: Home Latitude
    initial: 43.072241
    mode: box
    min: -90
    max: 90
    step: 0.000001
  milwaukee_longitude:
    name: Home Longitude
    initial: -87.961785
    mode: box
    min: -180
    max: 180
    step: 0.000001

automation:
  - alias: "[Snow] Record Last Plow Date"
    id: snow_update_last_plowed
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.snow_plow_status
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state not in ['unknown', 'unavailable', 'No recent activity', 'System Outage'] }}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_snow_plow
        data:
          date: "{{ now().date().isoformat() }}"

  - alias: "[Snow] Notify when Plows Nearby"
    id: snow_plows_nearby_notification
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.plows_active_nearby
        to: 'on'
    action:
      - service: notify.notify
        data:
          title: "❄️ Snow Plows Active"
          message: "A plow was detected near {{ states('sensor.snow_plow_road_name') }}."
