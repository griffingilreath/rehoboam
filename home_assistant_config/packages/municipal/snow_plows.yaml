      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/Leaf_Routes_061022_view/FeatureServer/0/query?f=json&geometry={{ states('input_number.milwaukee_longitude') }},{{ states('input_number.milwaukee_latitude') }}&geometryType=esriGeometryPoint&inSR=4326&outFields=SANLEAF,Status,FinalRound&returnGeometry=false
    method: GET
    scan_interval: 21600
    timeout: 30
    sensor:
      - name: mke_leaf_status_raw
        unique_id: mke_leaf_status_raw
        value_template: >-
          {% if value_json is mapping and 'features' in value_json %}
            {{ value_json.features | count }}
          {% else %}
            0
          {% endif %}
        json_attributes:
          - features

