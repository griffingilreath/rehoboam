###############################################################################
# PACKAGE: MILWAUKEE MUNICIPAL SERVICES (SNOW & LEAVES)
#
# Description:
#   This package tracks municipal services for Milwaukee, specifically:
#   1. Snow Plow Operations (Winter): Tracks plow activity near your home.
#   2. Leaf Collection (Fall): Tracks leaf pickup zones and schedule.
#   3. Garbage/Recycling: Tracks next pickup dates.
#
# Data Sources:
#   - Milwaukee Open Data / ArcGIS REST Services
#   - DPW Sanitation Website
#
# Configuration:
#   - Ensure 'input_number.milwaukee_latitude' and 'longitude' are set to your home.
#
# Key Features:
#   - "Plows Active Nearby" binary sensor for alerts.
#   - "Leaf Rake Allowed" helper to know when to rake.
#   - History tracking of last plow time.
#
###############################################################################

# -----------------------------------------------------------------------------
# REST SENSORS
# Queries external APIs (City of Milwaukee ArcGIS)
# -----------------------------------------------------------------------------
rest:
  # 1. SNOW PLOWS: Query for activity within 100m of home
  - resource_template: >-
      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/SnowRoutes_PublicView/FeatureServer/0/query?f=json&geometry={{ states('input_number.milwaukee_longitude') }},{{ states('input_number.milwaukee_latitude') }}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&distance=100&units=esriSRUnit_Meter&outFields=roadname,lastserviced&returnGeometry=false
    method: GET
    scan_interval: 900  # 15 minutes
    timeout: 30
    sensor:
      - name: mke_snow_raw
        unique_id: mke_snow_raw
        value_template: >-
          {% if value_json is mapping and 'features' in value_json %}
            {{ value_json.features | count }}
          {% else %}
            0
          {% endif %}
        json_attributes:
          - features

  # 2. GARBAGE/RECYCLING: Query DPW Servlet (HTML Scraper placeholder)
  - resource: "https://itmdapps.milwaukee.gov/DpwServletsPublic/garbage_day?address=2930N39thStreet"
    method: GET
    scan_interval: 21600 # 6 hours
    timeout: 30
    sensor:
      - name: Milwaukee Garbage Raw
        unique_id: milwaukee_garbage_raw
        value_template: "ok"

  # 3. LEAF COLLECTION: Status of your specific leaf zone
  - resource_template: >-
      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/Leaf_Routes_061022_view/FeatureServer/0/query?f=json&geometry={{ states('input_number.milwaukee_longitude') }},{{ states('input_number.milwaukee_latitude') }}&geometryType=esriGeometryPoint&inSR=4326&outFields=SANLEAF,Status,FinalRound&returnGeometry=false
    method: GET
    scan_interval: 21600 # 6 hours
    timeout: 30
    sensor:
      - name: mke_leaf_status_raw
        unique_id: mke_leaf_status_raw
        value_template: >-
          {% if value_json is mapping and 'features' in value_json %}
            {{ value_json.features | count }}
          {% else %}
            0
          {% endif %}
        json_attributes:
          - features

  # 4. COMMUTE ROUTES: Monitor specific key intersections for snow status
  #    Add or remove roads here as needed.
  
  # W NATIONAL AVE
  - resource: >-
      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/SnowRoutes_PublicView/FeatureServer/0/query
      ?f=json
      &geometry=-87.91827,43.02324
      &geometryType=esriGeometryPoint
      &inSR=4326
      &spatialRel=esriSpatialRelIntersects
      &distance=1500
      &units=esriSRUnit_Meter
      &outFields=roadname,lastserviced
      &returnGeometry=false
    method: GET
    scan_interval: 900
    timeout: 30
    sensor:
      - name: mke_snow_w_national_ave
        unique_id: mke_snow_w_national_ave
        value_template: >-
          {% if value_json is mapping and 'features' in value_json %}
            {{ value_json.features | count }}
          {% else %}
            0
          {% endif %}
        json_attributes:
          - features

  # N 6TH ST (Example Commute Route)
  - resource: >-
      https://services1.arcgis.com/5ly0cVV70qsN8Soc/arcgis/rest/services/SnowRoutes_PublicView/FeatureServer/0/query
      ?f=json
      &geometry=-87.91853,43.03208
      &geometryType=esriGeometryPoint
      &inSR=4326
      &spatialRel=esriSpatialRelIntersects
      &distance=1500
      &units=esriSRUnit_Meter
      &outFields=roadname,lastserviced
      &returnGeometry=false
    method: GET
    scan_interval: 900
    timeout: 30
    sensor:
      - name: mke_snow_n_6th_st
        unique_id: mke_snow_n_6th_st
        value_template: >-
          {% if value_json is mapping and 'features' in value_json %}
            {{ value_json.features | count }}
          {% else %}
            0
          {% endif %}
        json_attributes:
          - features

# -----------------------------------------------------------------------------
# TEMPLATE SENSORS
# Process raw JSON from REST sensors into usable states
# -----------------------------------------------------------------------------
template:
  - sensor:
      # -- SNOW PLOW LOGIC --

      # 1. Identify which road near home was actually plowed
      - name: Snow Plow Road Name
        unique_id: snow_plow_road_name
        state: >-
          {% set features = state_attr('sensor.mke_snow_raw', 'features') | default([], true) %}
          {% if not features %}
            unknown
          {% else %}
            {# Extract road names from features #}
            {% set roads = features | map(attribute='attributes.roadname') | list %}
            {# Prioritize specific roads if multiple returned #}
            {% if 'N 39TH ST' in roads %}
              N 39TH ST
            {% elif 'W LOCUST ST' in roads %}
              W LOCUST ST
            {% else %}
              {{ roads[0] }}
            {% endif %}
          {% endif %}

      # 2. Get the specific timestamp of the last service
      - name: Snow Last Plowed
        unique_id: snow_last_plowed
        device_class: timestamp
        state: >-
          {% set features = state_attr('sensor.mke_snow_raw', 'features') | default([], true) %}
          {% set road = states('sensor.snow_plow_road_name') %}
          {% if not features or road in ['unknown', 'unavailable', ''] %}
            unknown
          {% else %}
            {% set match = features | selectattr('attributes.roadname', 'equalto', road) | list %}
            {% if match %}
              {% set ms = match[0].attributes.lastserviced %}
              {% if ms in [none, '', 0] %}
                unknown
              {% else %}
                {{ as_local(as_datetime(ms / 1000)).isoformat() }}
              {% endif %}
            {% else %}
              unknown
            {% endif %}
          {% endif %}

      # 3. Create a human-friendly status string
      - name: Snow Plow Status
        unique_id: snow_plow_status
        state: >-
          {% set last = states('sensor.snow_last_plowed') %}
          {% if last in ['unknown', 'unavailable', 'none', ''] %}
            No recent activity
          {% else %}
            {% set dt = as_datetime(last) %}
            {% set delta_min = (now() - dt).total_seconds() / 60 %}
            {% if delta_min <= 10 %}
              Within last 10 minutes
            {% elif delta_min <= 30 %}
              Between 10 and 30 minutes
            {% else %}
              Over 30 minutes
            {% endif %}
          {% endif %}
        attributes:
          roadname: "{{ states('sensor.snow_plow_road_name') }}"

      # -- LEAF COLLECTION LOGIC --

      # 4. Leaf Zone Status
      - name: Leaf Collection Progress
        unique_id: leaf_collection_progress
        state: >-
          {% set features = state_attr('sensor.mke_leaf_status_raw', 'features') | default([], true) %}
          {% if not features %}
            Status unknown
          {% else %}
            {% set attrs = features[0].attributes %}
            {% set status = attrs.Status if 'Status' in attrs else '' %}
            {% set final = attrs.FinalRound if 'FinalRound' in attrs else 'No' %}
            
            {% if final == 'Yes' and status == 'Collected' %}
              Collection complete
            {% elif status == 'Next' %}
              Area up next
            {% elif status == 'CollectionIP' %}
              Collection in progress
            {% else %}
              No collection imminent
            {% endif %}
          {% endif %}

      # 5. Raking Season Logic (Date-based)
      - name: Leaf Collection Season
        unique_id: leaf_collection_season
        state: >-
          {% set today = now().date() %}
          {% set y = today.year %}
          {% set start = strptime(y ~ '-10-01', '%Y-%m-%d').date() %}
          {% set end = strptime(y ~ '-11-15', '%Y-%m-%d').date() %}
          {% if today < start %}
            Too Early
          {% elif today <= end %}
            Rake‑out Window
          {% else %}
            Season Over
          {% endif %}

  - binary_sensor:
      # Alert: Are plows working right now?
      - name: Plows Active Nearby
        unique_id: snow_plows_nearby
        state: >-
          {% set status = states('sensor.snow_plow_status') %}
          {{ status in ['Within last 10 minutes', 'Between 10 and 30 minutes'] }}

      # Alert: Can I rake my leaves today?
      - name: Leaf Rake Allowed
        unique_id: leaf_rake_allowed_binary
        state: >-
          {{ 'Rake‑out Window' in states('sensor.leaf_collection_season') }}

# -----------------------------------------------------------------------------
# HELPERS
# -----------------------------------------------------------------------------
input_datetime:
  last_snow_plow:
    name: Last Snow Plow Date
    has_date: true
    has_time: false

input_number:
  milwaukee_latitude:
    name: Home Latitude
    initial: 43.072241
    mode: box
    min: -90
    max: 90
    step: 0.000001
  milwaukee_longitude:
    name: Home Longitude
    initial: -87.961785
    mode: box
    min: -180
    max: 180
    step: 0.000001

# -----------------------------------------------------------------------------
# AUTOMATIONS
# -----------------------------------------------------------------------------
automation:
  - alias: "[Snow] Record Last Plow Date"
    id: snow_update_last_plowed
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.snow_plow_status
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state not in ['unknown', 'unavailable', 'No recent activity'] }}
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_snow_plow
        data:
          date: "{{ now().date().isoformat() }}"

  - alias: "[Snow] Notify when Plows Nearby"
    id: snow_plows_nearby_notification
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.plows_active_nearby
        to: 'on'
    action:
      - service: notify.notify
        data:
          title: "❄️ Snow Plows Active"
          message: "A plow was detected near {{ states('sensor.snow_plow_road_name') }}."
