###############################################################################
# PACKAGE: WATER USAGE & FLUME MONITORING
# 
# Description:
#   This package integrates the Flume water monitor to track water usage, detect
#   active sessions (showers, sprinklers, leaks), and categorize usage types.
#   It converts flow rates, calculates costs, and sums usage by category.
#
# Components:
#   - Flume Sensor Integration (via MQTT/Cloud sensors)
#   - Session Tracking (detects continuous water flow)
#   - Cost Calculation (USD/gal)
#   - Utility Meters (Daily/Weekly/Monthly totals)
#
# Key Entities to Edit:
#   - input_number.water_price_usd_per_gal: Set your local water rate.
#   - input_number.water_min_flow_gpm: Threshold to consider water "ON".
#
###############################################################################

homeassistant:
  customize_glob:
    # Ensure water sensors display correctly in Energy Dashboard and UI
    "sensor.water_*_daily":
      device_class: water
      unit_of_measurement: gal
      state_class: total
    "sensor.water_*_weekly":
      device_class: water
      unit_of_measurement: gal
      state_class: total
    "sensor.water_*_monthly":
      device_class: water
      unit_of_measurement: gal
      state_class: total
    "sensor.flume_portal_categories_water_*_yesterday":
      device_class: water
      unit_of_measurement: gal
      state_class: total
    "sensor.flume_portal_categories_water_*_today":
      device_class: water
      unit_of_measurement: gal
      state_class: total

# -----------------------------------------------------------------------------
# INPUT BOOLEANS
# Toggles for logic behavior
# -----------------------------------------------------------------------------
input_boolean:
  water_is_gph:
    name: Water sensor is GPH (convert to GPM)
    icon: mdi:water-pump
    initial: false

# -----------------------------------------------------------------------------
# INPUT NUMBERS
# User-adjustable settings and persistent storage for totals
# -----------------------------------------------------------------------------
input_number:
  # -- Settings --
  water_price_usd_per_gal:
    name: Water Price
    icon: mdi:currency-usd
    min: 0
    max: 5
    step: 0.0001
    mode: box
    unit_of_measurement: "USD/gal"
    initial: 0.0123

  water_min_flow_gpm:
    name: Min Flow Threshold (Start Session)
    icon: mdi:filter-menu
    min: 0
    max: 5
    step: 0.01
    unit_of_measurement: "gal/min"
    initial: 0.10

  water_session_gap_seconds:
    name: Session Gap Tolerance
    description: "Seconds of zero flow allowed before ending a session"
    min: 10
    max: 600
    step: 5
    unit_of_measurement: s
    initial: 60

  # -- Live Session Data (Do not edit manually) --
  water_session_volume_gal:
    name: Current Session Volume
    min: 0
    max: 5000
    step: 0.001
    unit_of_measurement: gal

  water_session_runtime_min:
    name: Current Session Duration
    min: 0
    max: 2000
    step: 0.01
    unit_of_measurement: min

  # -- Last Session Snapshot (For display/history) --
  water_last_session_volume_gal:
    name: Last Session Volume
    min: 0
    max: 5000
    step: 0.001
    unit_of_measurement: gal

  water_last_session_duration_min:
    name: Last Session Duration
    min: 0
    max: 2000
    step: 0.01
    unit_of_measurement: min

  water_last_session_avg_flow_gpm:
    name: Last Session Avg Flow
    min: 0
    max: 20
    step: 0.001
    unit_of_measurement: "gal/min"

  # -- Category Cumulative Totals (All Time) --
  water_total_shower_gal:
    name: "Total: Shower"
    min: 0
    max: 1000000
    step: 0.1
    unit_of_measurement: gal
  water_total_toilet_gal:
    name: "Total: Toilet"
    min: 0
    max: 1000000
    step: 0.1
    unit_of_measurement: gal
  water_total_sink_gal:
    name: "Total: Sink"
    min: 0
    max: 1000000
    step: 0.1
    unit_of_measurement: gal
  water_total_dishwasher_gal:
    name: "Total: Dishwasher"
    min: 0
    max: 1000000
    step: 0.1
    unit_of_measurement: gal
  water_total_washer_gal:
    name: "Total: Washer"
    min: 0
    max: 1000000
    step: 0.1
    unit_of_measurement: gal
  water_total_outdoor_gal:
    name: "Total: Outdoor"
    min: 0
    max: 1000000
    step: 0.1
    unit_of_measurement: gal
  water_total_other_gal:
    name: "Total: Other"
    min: 0
    max: 1000000
    step: 0.1
    unit_of_measurement: gal

# -----------------------------------------------------------------------------
# INPUT DATETIMES
# Timestamps for logic tracking
# -----------------------------------------------------------------------------
input_datetime:
  water_session_last_tick:
    name: Water session last tick
    has_date: true
    has_time: true
  water_last_session_end:
    name: Water last session ended
    has_date: true
    has_time: true

# -----------------------------------------------------------------------------
# SENSORS & BINARY SENSORS (TEMPLATE)
# Derived data from raw inputs
# -----------------------------------------------------------------------------
template:
  - sensor:
      # Expose Price as a sensor for Energy Dashboard
      - name: "Water price (USD/gal)"
        unique_id: water_price_usd_per_gal_sensor
        unit_of_measurement: "USD/gal"
        state: "{{ states('input_number.water_price_usd_per_gal') | float(0) }}"

      # Normalized Flow Rate (GPM)
      # Handles GPH -> GPM conversion if needed
      - name: "Water Flow (GPM)"
        unique_id: water_flow_gpm
        unit_of_measurement: "gal/min"
        state_class: measurement
        device_class: volume_flow_rate
        state: >-
          {% set raw = states('sensor.flume_sensor_sherman_park_current')|float(0) %}
          {% if is_state('input_boolean.water_is_gph','on') %}
            {{ (raw / 60) | round(3) }}
          {% else %}
            {{ raw | round(3) }}
          {% endif %}

      # -- Live Session Metrics --
      - name: "Water Session Volume Gal"
        unique_id: water_session_volume_gal_live
        unit_of_measurement: "gal"
        state_class: measurement
        state: "{{ states('input_number.water_session_volume_gal')|float(0) | round(3) }}"

      - name: "Water Session Runtime"
        unique_id: water_session_runtime_min_live
        unit_of_measurement: "min"
        state_class: measurement
        state: "{{ states('input_number.water_session_runtime_min')|float(0) | round(2) }}"

      - name: "Water Session Avg Flow GPM"
        unique_id: water_session_avg_flow_gpm_live
        unit_of_measurement: "gal/min"
        device_class: volume_flow_rate
        state_class: measurement
        state: >-
          {% set vol = states('input_number.water_session_volume_gal')|float(0) %}
          {% set dur = states('input_number.water_session_runtime_min')|float(0) %}
          {{ (vol / dur) | round(3) if dur > 0 else 0 }}

      # -- Last Session Metrics (Snapshot) --
      - name: "water_monitor_last_session_volume_gal"
        unit_of_measurement: "gal"
        state_class: measurement
        state: "{{ states('input_number.water_last_session_volume_gal')|float(0) | round(3) }}"

      - name: "water_monitor_last_session_duration_min"
        unit_of_measurement: "min"
        state_class: measurement
        state: "{{ states('input_number.water_last_session_duration_min')|float(0) | round(2) }}"

      # -- Flume Yesterday Data --
      - name: Flume yesterday last update
        unique_id: flume_yesterday_last_update
        state: >
          {% set e = states.get('sensor.flume_portal_categories_water_total_yesterday') %}
          {% if e is not none %}
            {{ e.last_changed.astimezone().strftime('%Y-%m-%d %I:%M %p') }}
          {% else %}
            unknown
          {% endif %}

  - binary_sensor:
      - name: "water_monitor_in_session"
        state: "{{ is_state('binary_sensor.water_in_session','on') }}"

      - name: Flume yesterday updated today
        unique_id: flume_yesterday_updated_today
        state: >
          {% set e = states.get('sensor.flume_portal_categories_water_total_yesterday') %}
          {{ e is not none and now().date() == e.last_changed.date() }}

# High-Level Binary Sensor: Is water flowing?
binary_sensor:
  - platform: template
    sensors:
      water_in_session:
        friendly_name: "Water in session"
        value_template: >-
          {{ states('sensor.water_flow_gpm')|float(0) >= states('input_number.water_min_flow_gpm')|float(0.1) }}

# -----------------------------------------------------------------------------
# TIMER
# Handles the "gap" where water stops briefly (e.g. soaping up in shower)
# -----------------------------------------------------------------------------
timer:
  water_gap_timer:
    duration: "00:01:00"

# -----------------------------------------------------------------------------
# UTILITY METERS
# Tracks usage over time intervals (Daily, Weekly, Monthly)
# -----------------------------------------------------------------------------
utility_meter:
  water_shower_daily:   { source: input_number.water_total_shower_gal,   cycle: daily,   name: "Shower Usage (Day)" }
  water_shower_weekly:  { source: input_number.water_total_shower_gal,   cycle: weekly,  name: "Shower Usage (Week)" }
  water_shower_monthly: { source: input_number.water_total_shower_gal,   cycle: monthly, name: "Shower Usage (Month)" }

  water_toilet_daily:   { source: input_number.water_total_toilet_gal,   cycle: daily,   name: "Toilet Usage (Day)" }
  water_toilet_weekly:  { source: input_number.water_total_toilet_gal,   cycle: weekly,  name: "Toilet Usage (Week)" }
  water_toilet_monthly: { source: input_number.water_total_toilet_gal,   cycle: monthly, name: "Toilet Usage (Month)" }

  water_sink_daily:     { source: input_number.water_total_sink_gal,     cycle: daily,   name: "Sink Usage (Day)" }
  water_dish_daily:     { source: input_number.water_total_dishwasher_gal, cycle: daily, name: "Dishwasher Usage (Day)" }
  water_washer_daily:   { source: input_number.water_total_washer_gal,   cycle: daily,   name: "Washing Machine Usage (Day)" }
  water_outdoor_daily:  { source: input_number.water_total_outdoor_gal,  cycle: daily,   name: "Outdoor Usage (Day)" }
  water_other_daily:    { source: input_number.water_total_other_gal,    cycle: daily,   name: "Other Usage (Day)" }

# -----------------------------------------------------------------------------
# AUTOMATIONS
# Core logic for tracking sessions and categorization
# -----------------------------------------------------------------------------
automation:
  # 1. Start Session: Reset counters when water starts flowing
  - id: water_session_start_reset
    alias: "[Water] Session Start -> Reset"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.water_in_session
        from: "off"
        to: "on"
    action:
      - service: timer.cancel
        target: { entity_id: timer.water_gap_timer }
      - service: input_number.set_value
        target: { entity_id: input_number.water_session_volume_gal }
        data: { value: 0 }
      - service: input_number.set_value
        target: { entity_id: input_number.water_session_runtime_min }
        data: { value: 0 }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.water_session_last_tick }
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # 2. Accumulate: Add volume every 5 seconds while flowing
  - id: water_session_accumulate
    alias: "[Water] Accumulate Volume"
    mode: single
    trigger:
      - platform: time_pattern
        seconds: "/5"
    condition:
      - condition: state
        entity_id: binary_sensor.water_in_session
        state: "on"
    variables:
      flow_gpm: "{{ states('sensor.water_flow_gpm')|float(0) }}"
      last_str: "{{ states('input_datetime.water_session_last_tick') }}"
      now_ts: "{{ as_timestamp(now()) }}"
      last_ts: >-
        {% if last_str in ['unknown','unavailable',''] %}
          {{ now_ts }}
        {% else %}
          {{ as_timestamp(as_datetime(last_str)) }}
        {% endif %}
      dt_raw: "{{ now_ts - last_ts }}"
      dt_sec: "{{ [ [dt_raw, 0] | max, 60 ] | min }}"
      add_gal: "{{ (flow_gpm * (dt_sec/60)) | float(0) }}"
      add_min: "{{ (dt_sec/60) | float(0) }}"
    action:
      - service: input_number.set_value
        target: { entity_id: input_number.water_session_volume_gal }
        data:
          value: "{{ (states('input_number.water_session_volume_gal')|float(0) + add_gal) | round(3) }}"
      - service: input_number.set_value
        target: { entity_id: input_number.water_session_runtime_min }
        data:
          value: "{{ (states('input_number.water_session_runtime_min')|float(0) + add_min) | round(2) }}"
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.water_session_last_tick }
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # 3. Gap Timer: Handle brief pauses in flow
  - id: water_gap_timer_control
    alias: "[Water] Manage Gap Timer"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.water_in_session
        from: "off"
        to: "on"
      - platform: state
        entity_id: binary_sensor.water_in_session
        from: "on"
        to: "off"
    variables:
      gap: "{{ states('input_number.water_session_gap_seconds')|int(60) }}"
    action:
      - choose:
          - conditions: "{{ is_state('binary_sensor.water_in_session','on') }}"
            sequence:
              - service: timer.cancel
                target: { entity_id: timer.water_gap_timer }
          - conditions: "{{ is_state('binary_sensor.water_in_session','off') }}"
            sequence:
              - service: timer.start
                data:
                  entity_id: timer.water_gap_timer
                  duration: "{{ '00:%02d:%02d'|format((gap//60)%60, gap%60) }}"

  # 4. Finalize: Session ended (gap timer finished)
  - id: water_session_finalize
    alias: "[Water] Finalize Session"
    mode: queued
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.water_gap_timer
    variables:
      vol: "{{ states('input_number.water_session_volume_gal')|float(0) }}"
      dur_min: "{{ states('input_number.water_session_runtime_min')|float(0) }}"
      avg: "{{ (vol / dur_min) | float(0) if dur_min > 0 else 0 }}"
    action:
      - choose:
          # Only record significant sessions (>0.02 gal)
          - conditions: "{{ vol > 0.02 and dur_min > 0.05 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.water_last_session_volume_gal }
                data: { value: "{{ vol | round(3) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.water_last_session_duration_min }
                data: { value: "{{ dur_min | round(2) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.water_last_session_avg_flow_gpm }
                data: { value: "{{ avg | round(3) }}" }
              - service: input_datetime.set_datetime
                target: { entity_id: input_datetime.water_last_session_end }
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              # Fire event for categorization
              - event: water_monitor_session_ended
                event_data:
                  volume_gal: "{{ vol }}"
                  duration_min: "{{ dur_min }}"
                  avg_flow_gpm: "{{ avg }}"
      # Reset live counters
      - service: input_number.set_value
        target: { entity_id: input_number.water_session_volume_gal }
        data: { value: 0 }
      - service: input_number.set_value
        target: { entity_id: input_number.water_session_runtime_min }
        data: { value: 0 }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.water_session_last_tick }
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # 5. Categorize: Guess what used the water based on Flow + Duration profiles
  - id: water_session_categorize_and_sum
    alias: "[Water] Categorize Usage"
    mode: queued
    trigger:
      - platform: event
        event_type: water_monitor_session_ended
    variables:
      vol: "{{ trigger.event.data.volume_gal|float(0) }}"
      dur_min: "{{ trigger.event.data.duration_min|float(0) }}"
      avg: "{{ trigger.event.data.avg_flow_gpm|float(0) }}"
    action:
      - choose:
          # Toilet: Short duration, moderate volume (1-3 gal)
          - conditions: "{{ 1.0 <= vol <= 3.2 and dur_min <= 2.5 and 0.4 <= avg <= 2.2 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.water_total_toilet_gal }
                data: { value: "{{ states('input_number.water_total_toilet_gal')|float(0) + vol }}" }

          # Shower: Longer duration (>4.5 min), moderate flow
          - conditions: "{{ dur_min >= 4.5 and 1.0 <= avg <= 3.2 and vol >= 5 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.water_total_shower_gal }
                data: { value: "{{ states('input_number.water_total_shower_gal')|float(0) + vol }}" }

          # Dishwasher: Very long (50-150 min), low avg flow (sips water)
          - conditions: "{{ 50 <= dur_min <= 150 and 0.2 <= avg <= 1.2 and vol >= 3 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.water_total_dishwasher_gal }
                data: { value: "{{ states('input_number.water_total_dishwasher_gal')|float(0) + vol }}" }

          # Washing Machine: Medium duration (18-70 min), high variance flow
          - conditions: "{{ 18 <= dur_min <= 70 and 0.8 <= avg <= 2.6 and vol >= 5 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.water_total_washer_gal }
                data: { value: "{{ states('input_number.water_total_washer_gal')|float(0) + vol }}" }

          # Outdoor: High flow, any duration OR long duration high flow
          - conditions: "{{ dur_min >= 2 and avg >= 2.0 and not (dur_min >= 4.5 and avg <= 3.2) }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.water_total_outdoor_gal }
                data: { value: "{{ states('input_number.water_total_outdoor_gal')|float(0) + vol }}" }

          # Sink: Short duration, low volume, low flow
          - conditions: "{{ 0.4 <= dur_min <= 6 and 0.2 <= avg <= 1.2 and vol <= 3.5 }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.water_total_sink_gal }
                data: { value: "{{ states('input_number.water_total_sink_gal')|float(0) + vol }}" }

        # Default catch-all
        default:
          - service: input_number.set_value
            target: { entity_id: input_number.water_total_other_gal }
            data: { value: "{{ states('input_number.water_total_other_gal')|float(0) + vol }}" }
